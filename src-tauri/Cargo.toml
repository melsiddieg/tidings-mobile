[package]
name = "tidings"
version = "0.9.4"
description = "A private, secure RSS and Atom feed reader"
repository = "https://github.com/melsiddieg/tidings"
homepage = "https://github.com/melsiddieg/tidings"
authors = ["Mohammed Abdallah"]
edition = "2021"
rust-version = "1.89"
resolver = "3"

[lib]
name = "tidings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "net", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "brotli", "deflate", "socks", "http2", "charset"] }
feed-rs = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
ammonia = "4"
dom_smoothie = "0.19"
dom_query = "0.29"
quick-xml = "0.42"
url = "2"
base64 = "0.22"
lru = "0.18"
open = "5"
thiserror = "2"
chrono = "0.4"
log = "0.4"
encoding_rs = "0.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
gif = "0.14"
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# Do not set `panic = "abort"`. On macOS, WebKit throws an Objective-C exception when
# wry answers a tidings:// request that the web view has just cancelled. wry catches it
# with objc2::exception::catch, which only works when Rust code can unwind. With
# panic = "abort" the exception aborts the whole app (the 0.4.0/0.4.1 crash).

# Image decoding and encoding (images.rs) is slow at opt-level "s", and very slow in
# debug builds. Build those crates for speed in both profiles.
[profile.release.package.image]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.image-webp]
opt-level = 3
[profile.release.package.gif]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.weezl]
opt-level = 3

[profile.dev]
debug = 0
strip = "debuginfo"
incremental = false

[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
